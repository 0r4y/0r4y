  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="brilho" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="borda"><rect width="900" height="70" rx="18"/></clipPath>
  </defs>
  <style>
    .fundo { fill: url(#ceu); }
    .gota { stroke: #d4d4d4; stroke-linecap: round; }
