    .raio { fill: none; stroke: #ffffff; stroke-linejoin: round; stroke-linecap: round; opacity: 0; }
    .clarao { fill: #ffffff; opacity: 0; }
    .titulo { font: 600 52px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #f5f5f5; letter-spacing: 6px; }
    .sub { font: 400 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8a8a8a; letter-spacing: 3px; }
    .code { font: 400 15px Consolas, 'SFMono-Regular', Menlo, monospace; fill: #6b6b6b; }
    .kw { fill: #e0e0e0; font-weight: 700; } .st { fill: #a8a8a8; } .fn { fill: #cfcfcf; }
    @keyframes cair { from { transform: translateY(-40px); } to { transform: translateY(var(--h)); } }
    @keyframes ondular { 0% { transform: scale(0.1); opacity: 0.6; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes piscar { 0%, 100% { opacity: 0; } 1% { opacity: 1; } 2% { opacity: 0.15; } 3% { opacity: 0.9; } 6% { opacity: 0; } }
    @keyframes clarear { 0%, 100% { opacity: 0; } 1% { opacity: 0.10; } 2% { opacity: 0.02; } 3% { opacity: 0.08; } 7% { opacity: 0; } }
    .cai { animation: cair linear infinite; }
    .ondula { transform-box: fill-box; transform-origin: center; animation: ondular ease-out infinite; }
    .pisca { animation: piscar linear infinite; }
    .clareia { animation: clarear linear infinite; }
  </style>
