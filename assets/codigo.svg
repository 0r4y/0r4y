<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <filter id="brilho" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="borda"><rect width="900" height="454" rx="14"/></clipPath>
  </defs>
  <style>
    .gota { stroke: #e6e6e6; stroke-linecap: round; }
    .onda { fill: none; stroke: #e6e6e6; }
    .raio { fill: none; stroke: #ffffff; stroke-linejoin: round; stroke-linecap: round; opacity: 0; }
    .clarao { fill: #ffffff; opacity: 0; }
    @keyframes cair { from { transform: translateY(-30px); } to { transform: translateY(var(--h)); } }
    @keyframes ondular { 0% { transform: scale(0.1); opacity: 0.25; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes piscar { 0%, 100% { opacity: 0; } 1% { opacity: 0.95; } 1.8% { opacity: 0.1; } 2.6% { opacity: 0.8; } 5% { opacity: 0; } }
    @keyframes clarear { 0%, 100% { opacity: 0; } 1% { opacity: 0.07; } 1.8% { opacity: 0.01; } 2.6% { opacity: 0.05; } 6% { opacity: 0; } }
    .cai { animation: cair linear infinite; }
    .ondula { transform-box: fill-box; transform-origin: center; animation: ondular ease-out infinite; }
    .pisca { animation: piscar linear infinite; }
    .clareia { animation: clarear linear infinite; }
  </style>
  <g clip-path="url(#borda)">
    <rect width="900" height="454" fill="url(#ceu)"/>
    <line class="gota cai" x1="160.4" y1="0" x2="158.9" y2="12.4" stroke-width="0.8" opacity="0.09" style="--h:454px;animation-duration:1.63s;animation-delay:-0.79s"/>
    <line class="gota cai" x1="461.9" y1="0" x2="460.4" y2="7.8" stroke-width="0.8" opacity="0.09" style="--h:454px;animation-duration:1.58s;animation-delay:-1.30s"/>
    <line class="gota cai" x1="700.8" y1="0" x2="699.3" y2="12.2" stroke-width="0.8" opacity="0.22" style="--h:454px;animation-duration:1.37s;animation-delay:-0.42s"/>
    <line class="gota cai" x1="267.7" y1="0" x2="266.2" y2="8.8" stroke-width="0.8" opacity="0.21" style="--h:454px;animation-duration:1.94s;animation-delay:-0.81s"/>
    <line class="gota cai" x1="254.6" y1="0" x2="253.1" y2="12.2" stroke-width="0.8" opacity="0.23" style="--h:454px;animation-duration:1.47s;animation-delay:-0.12s"/>
    <line class="gota cai" x1="42.3" y1="0" x2="40.8" y2="7.8" stroke-width="0.8" opacity="0.11" style="--h:454px;animation-duration:1.90s;animation-delay:-1.90s"/>
    <line class="gota cai" x1="562.1" y1="0" x2="560.6" y2="7.7" stroke-width="0.8" opacity="0.19" style="--h:454px;animation-duration:1.69s;animation-delay:-0.08s"/>
    <line class="gota cai" x1="805.7" y1="0" x2="804.2" y2="10.8" stroke-width="0.8" opacity="0.17" style="--h:454px;animation-duration:1.41s;animation-delay:-0.67s"/>
    <line class="gota cai" x1="757.1" y1="0" x2="755.6" y2="7.9" stroke-width="0.8" opacity="0.17" style="--h:454px;animation-duration:1.87s;animation-delay:-1.30s"/>
    <line class="gota cai" x1="692.4" y1="0" x2="690.9" y2="13.0" stroke-width="0.8" opacity="0.08" style="--h:454px;animation-duration:1.52s;animation-delay:-1.39s"/>
    <line class="gota cai" x1="635.6" y1="0" x2="634.1" y2="11.4" stroke-width="0.8" opacity="0.14" style="--h:454px;animation-duration:1.41s;animation-delay:-0.61s"/>
    <line class="gota cai" x1="392.7" y1="0" x2="391.2" y2="9.5" stroke-width="0.8" opacity="0.14" style="--h:454px;animation-duration:1.56s;animation-delay:-0.30s"/>
    <line class="gota cai" x1="133.2" y1="0" x2="131.7" y2="8.1" stroke-width="0.8" opacity="0.16" style="--h:454px;animation-duration:1.44s;animation-delay:-0.08s"/>
    <line class="gota cai" x1="861.2" y1="0" x2="859.7" y2="10.0" stroke-width="0.8" opacity="0.15" style="--h:454px;animation-duration:1.40s;animation-delay:-0.29s"/>
    <circle cx="26" cy="24" r="5" fill="#2a2a2a"/><circle cx="44" cy="24" r="5" fill="#2a2a2a"/><circle cx="62" cy="24" r="5" fill="#2a2a2a"/>
    <text x="450.0" y="29" fill="#555555" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" text-anchor="middle">sobre.py</text>
    <line x1="0" y1="44" x2="900" y2="44" stroke="#161616"/>
    <g font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="14.5">
      <text x="34" y="66" fill="#333333" text-anchor="end">1</text>
      <text x="52" y="66" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">import</tspan><tspan fill="#a3a3a3"> </tspan><tspan fill="#a3a3a3">sqlite3</tspan></text>
      <text x="34" y="88" fill="#333333" text-anchor="end">2</text>
      <text x="52" y="88" xml:space="preserve"></text>
      <text x="34" y="110" fill="#333333" text-anchor="end">3</text>
      <text x="52" y="110" xml:space="preserve"><tspan fill="#a3a3a3">conn</tspan><tspan fill="#a3a3a3"> = </tspan><tspan fill="#a3a3a3">sqlite3</tspan><tspan fill="#a3a3a3">.</tspan><tspan fill="#d0d0d0">connect</tspan><tspan fill="#a3a3a3">(</tspan><tspan fill="#8c8c8c">&quot;0r4y.db&quot;</tspan><tspan fill="#a3a3a3">)</tspan></text>
      <text x="34" y="132" fill="#333333" text-anchor="end">4</text>
      <text x="52" y="132" xml:space="preserve"><tspan fill="#a3a3a3">conn</tspan><tspan fill="#a3a3a3">.</tspan><tspan fill="#d0d0d0">execute</tspan><tspan fill="#a3a3a3">(</tspan><tspan fill="#8c8c8c">&quot;CREATE TABLE IF NOT EXISTS sobre (chave TEXT, valor TEXT)&quot;</tspan><tspan fill="#a3a3a3">)</tspan></text>
      <text x="34" y="154" fill="#333333" text-anchor="end">5</text>
      <text x="52" y="154" xml:space="preserve"><tspan fill="#a3a3a3">conn</tspan><tspan fill="#a3a3a3">.</tspan><tspan fill="#d0d0d0">executemany</tspan><tspan fill="#a3a3a3">(</tspan><tspan fill="#8c8c8c">&quot;INSERT INTO sobre VALUES (?, ?)&quot;</tspan><tspan fill="#a3a3a3">, [</tspan></text>
      <text x="34" y="176" fill="#333333" text-anchor="end">6</text>
      <text x="52" y="176" xml:space="preserve"><tspan fill="#a3a3a3">    (</tspan><tspan fill="#8c8c8c">&quot;linguagem&quot;</tspan><tspan fill="#a3a3a3">, </tspan><tspan fill="#8c8c8c">&quot;Python&quot;</tspan><tspan fill="#a3a3a3">), (</tspan><tspan fill="#8c8c8c">&quot;banco&quot;</tspan><tspan fill="#a3a3a3">, </tspan><tspan fill="#8c8c8c">&quot;SQLite3&quot;</tspan><tspan fill="#a3a3a3">),</tspan></text>
      <text x="34" y="198" fill="#333333" text-anchor="end">7</text>
      <text x="52" y="198" xml:space="preserve"><tspan fill="#a3a3a3">    (</tspan><tspan fill="#8c8c8c">&quot;faz&quot;</tspan><tspan fill="#a3a3a3">, </tspan><tspan fill="#8c8c8c">&quot;bots para Discord&quot;</tspan><tspan fill="#a3a3a3">), (</tspan><tspan fill="#8c8c8c">&quot;clima&quot;</tspan><tspan fill="#a3a3a3">, </tspan><tspan fill="#8c8c8c">&quot;chuva e trovões&quot;</tspan><tspan fill="#a3a3a3">),</tspan></text>
      <text x="34" y="220" fill="#333333" text-anchor="end">8</text>
      <text x="52" y="220" xml:space="preserve"><tspan fill="#a3a3a3">])</tspan></text>
      <text x="34" y="242" fill="#333333" text-anchor="end">9</text>
      <text x="52" y="242" xml:space="preserve"></text>
      <text x="34" y="264" fill="#333333" text-anchor="end">10</text>
      <text x="52" y="264" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">for</tspan><tspan fill="#a3a3a3"> </tspan><tspan fill="#a3a3a3">chave</tspan><tspan fill="#a3a3a3">, </tspan><tspan fill="#a3a3a3">valor</tspan><tspan fill="#a3a3a3"> </tspan><tspan fill="#ffffff" font-weight="700">in</tspan><tspan fill="#a3a3a3"> </tspan><tspan fill="#a3a3a3">conn</tspan><tspan fill="#a3a3a3">.</tspan><tspan fill="#d0d0d0">execute</tspan><tspan fill="#a3a3a3">(</tspan><tspan fill="#8c8c8c">&quot;SELECT * FROM sobre&quot;</tspan><tspan fill="#a3a3a3">):</tspan></text>
      <text x="34" y="286" fill="#333333" text-anchor="end">11</text>
      <text x="52" y="286" xml:space="preserve"><tspan fill="#a3a3a3">    </tspan><tspan fill="#d0d0d0">print</tspan><tspan fill="#a3a3a3">(</tspan><tspan fill="#8c8c8c">f&quot;{chave:&gt;9} → {valor}&quot;</tspan><tspan fill="#a3a3a3">)</tspan></text>
      <line x1="24" y1="304" x2="876" y2="304" stroke="#1f1f1f"/>
      <text x="52" y="334" fill="#6e6e6e" xml:space="preserve">linguagem → Python</text>
      <text x="52" y="356" fill="#6e6e6e" xml:space="preserve">    banco → SQLite3</text>
      <text x="52" y="378" fill="#6e6e6e" xml:space="preserve">      faz → bots para Discord</text>
      <text x="52" y="400" fill="#6e6e6e" xml:space="preserve">    clima → chuva e trovões</text>
      <text x="34" y="334" fill="#444444" text-anchor="end">›</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="453" rx="14" fill="none" stroke="#1c1c1c"/>
</svg>
